<div class="gs-expand-wrap">
  <button type="button" class="gs-expand-all" aria-expanded="false">Expand all</button>
</div>

<style>
/* Everything is scoped to .tfgr-policy (the Terms of Sale panel), so other pages are untouched. */
.tfgr-policy .gs-expand-wrap {
  display: flex;
  justify-content: flex-end;
  margin: 0 20px 1.5rem 0; /* right margin lines it up with the right column */
}
.tfgr-policy .gs-expand-all {
  display: inline-flex;
  align-items: center;
  gap: 0.6rem;
  padding: 0.6rem 1.25rem;
  font: inherit;
  font-weight: 700;
  color: #1d1f21;
  background: #ffffff;
  border: 1px solid var(--wp--preset--color--palette-color-1, var(--theme-palette-color-1, #b11f24));
  border-radius: 0;
  cursor: pointer;
  transition: background-color .2s, color .2s;
}
.tfgr-policy .gs-expand-all::before {
  content: "+";
  font-weight: 400;
  line-height: 1;
  color: var(--wp--preset--color--palette-color-1, var(--theme-palette-color-1, #b11f24));
}
.tfgr-policy .gs-expand-all[aria-expanded="true"]::before { content: "−"; }
.tfgr-policy .gs-expand-all:hover,
.tfgr-policy .gs-expand-all:focus-visible {
  background: var(--wp--preset--color--palette-color-1, var(--theme-palette-color-1, #b11f24));
  color: #ffffff;
}
.tfgr-policy .gs-expand-all:hover::before,
.tfgr-policy .gs-expand-all:focus-visible::before { color: #ffffff; }
.tfgr-policy .gs-expand-all:focus-visible { outline: 2px solid var(--wp--preset--color--palette-color-1, var(--theme-palette-color-1, #b11f24)); outline-offset: 2px; }

/* Accordions: one bordered list per column, like the policy tables.
   !important is needed because GreenShift's own accordion styles are more specific. */
.tfgr-policy .gs-accordion {
  display: block !important;
  gap: 0 !important;
  padding: 0 !important;
  border-top: 1px solid #d9d5cc !important;
  background: #ffffff !important;
}
.tfgr-policy .gs-accordion .gs-accordion-item {
  margin: 0 !important;
  border: 1px solid #d9d5cc !important;
  border-top: 0 !important;
  border-radius: 0 !important;
  background: #ffffff !important;
  box-shadow: none !important;
}
.tfgr-policy .gs-accordion .gs-accordion-item .gs-accordion-item__title {
  padding: 1rem 1.5rem !important;
  margin: 0 !important;
  background: #ffffff !important;
  color: #1d1f21 !important;
  border: 0 !important;
  border-radius: 0 !important;
  box-shadow: none !important;
  transition: background-color .2s;
}
.tfgr-policy .gs-accordion .gs-accordion-item .gs-accordion-item__title:hover,
.tfgr-policy .gs-accordion .gs-accordion-item.gsopen > .gs-accordion-item__title,
.tfgr-policy .gs-accordion .gs-accordion-item .gs-accordion-item__title[aria-expanded="true"] {
  background: #f1ede5 !important;
}
.tfgr-policy .gs-accordion .gs-accordion-item.gsopen > .gs-accordion-item__title,
.tfgr-policy .gs-accordion .gs-accordion-item .gs-accordion-item__title[aria-expanded="true"] {
  border-bottom: 1px solid #d9d5cc !important;
}
.tfgr-policy .gs-accordion .gs-accordion-item .gs-accordion-item__title:focus-visible {
  outline: 2px solid var(--wp--preset--color--palette-color-1, var(--theme-palette-color-1, #b11f24));
  outline-offset: -2px;
}
.tfgr-policy .gs-accordion .gs-accordion-item__heading,
.tfgr-policy .gs-accordion .gs-accordion-item__heading strong {
  font-weight: 700 !important;
  color: #1d1f21 !important;
}
.tfgr-policy .gs-accordion .iconfortoggle { color: var(--wp--preset--color--palette-color-1, var(--theme-palette-color-1, #b11f24)) !important; }
.tfgr-policy .gs-accordion .iconfortoggle .gs-iconbefore,
.tfgr-policy .gs-accordion .iconfortoggle .gs-iconafter { background-color: var(--wp--preset--color--palette-color-1, var(--theme-palette-color-1, #b11f24)) !important; }
.tfgr-policy .gs-accordion .gs-accordion-item__content {
  background: #ffffff !important;
  border: 0 !important;
  box-shadow: none !important;
}
.tfgr-policy .gs-accordion .gs-accordion-item__text {
  padding: 1.25rem 1.5rem !important;
  color: #3a3d40 !important;
}
.tfgr-policy .gs-accordion .gs-accordion-item__text p { margin: 0 0 0.75rem 0 !important; }
.tfgr-policy .gs-accordion .gs-accordion-item__text > :last-child { margin-bottom: 0 !important; }
.tfgr-policy .gs-accordion .gs-accordion-item__text ul {
  list-style: none !important;
  margin: 0 !important;
  padding: 0 !important;
}
.tfgr-policy .gs-accordion .gs-accordion-item__text li {
  position: relative;
  margin: 0 !important;
  padding: 0.2rem 0 0.2rem 1.25rem !important;
}
.tfgr-policy .gs-accordion .gs-accordion-item__text li::before {
  content: "";
  position: absolute;
  left: 0;
  top: calc(0.2rem + 0.5lh - 1px);
  width: 0.6rem;
  height: 2px;
  background-color: var(--wp--preset--color--palette-color-1, var(--theme-palette-color-1, #b11f24));
}
</style>
<script>
document.addEventListener('click', function (e) {
  const btn = e.target.closest('.gs-expand-all');
  if (!btn) return;

  const expanding = btn.getAttribute('aria-expanded') !== 'true';

  document.querySelectorAll('.gs-accordion-item__title').forEach(title => {
    const item = title.closest('.gs-accordion-item');
    const isOpen = title.getAttribute('aria-expanded') === 'true' ||
                   (item && item.classList.contains('gsopen'));
    if (isOpen !== expanding) title.click();
  });

  btn.setAttribute('aria-expanded', expanding);
  btn.textContent = expanding ? 'Collapse all' : 'Expand all';
});
</script>
